[workspace]
channels = ["conda-forge"]
name = "orgwolf"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.7,<3.8"

[pypi-dependencies]
django = "==2.2.10"
django-mptt = "==0.9.1"
django-filter = "==2.4.0"
httplib2 = "*"
python-dateutil = "*"
pytz = "*"
djangorestframework = "==3.9.4"
requests = "*"
orgwolf = { path = ".", editable = true }

[feature.deploy.dependencies]
uwsgi = ">=2.0.20,<3"
mysqlclient = ">=2.0.3,<3"

[feature.pytest.pypi-dependencies]
pytest = ">=5.2.0"
pytest-django = ">=4"

[environments]
default = { solve-group = "default" }
dev = { features = ['pytest'], solve-group = "default" }
simon = { features = ['deploy'], solve-group = "default" }
